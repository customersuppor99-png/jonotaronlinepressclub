<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জনতার অনলাইন প্রেসক্লাব - ডেলিভারি তথ্য</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Hind Siliguri"', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-xl bg-white rounded-3xl shadow-2xl p-8 text-center border-t-4 border-blue-600">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">জনতার অনলাইন প্রেসক্লাব</h1>
        
        <!-- Countdown Section -->
        <div id="countdown-wrapper" class="space-y-4">
            <p class="text-lg text-slate-600">আপনার ডেলিভারি তথ্য প্রস্তুত হচ্ছে...</p>
            <div class="w-24 h-24 mx-auto rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin flex items-center justify-center">
                <span id="timerText" class="text-3xl font-bold text-blue-600">8</span>
            </div>
            <p class="text-sm text-slate-400">কিছুক্ষণের মধ্যেই ফর্মটি ওপেন হবে</p>
        </div>

        <!-- Hidden Success Section (Appears after 8s) -->
        <div id="action-wrapper" class="hidden animate-fade-in space-y-6">
            <div class="p-4 bg-green-50 border border-green-200 rounded-xl">
                <h2 class="text-2xl font-bold text-green-700">✅ কুরিয়ারের ঠিকানা জমা দিন</h2>
                <p class="text-slate-600 mt-2">আপনার ফর্মটি স্বয়ংক্রিয়ভাবে ওপেন হচ্ছে...</p>
            </div>
            
            <a href="https://forms.gle/aWYBxaV35vyamfVz7" target="_blank" 
               class="inline-block px-8 py-4 bg-blue-600 text-white font-bold rounded-full hover:bg-blue-700 transition shadow-lg">
               ম্যানুয়ালি ফর্ম ওপেন করুন
            </a>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let timeLeft = 8;
            const timerElement = document.getElementById('timerText');
            const countdownWrapper = document.getElementById('countdown-wrapper');
            const actionWrapper = document.getElementById('action-wrapper');
            const formUrl = "https://forms.gle/aWYBxaV35vyamfVz7";

            const countdown = setInterval(() => {
                timeLeft--;
                timerElement.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    countdownWrapper.style.display = 'none';
                    actionWrapper.classList.remove('hidden');
                    
                    // অটোমেটিক ফর্ম ওপেন হবে
                    window.open(formUrl, '_blank');
                }
            }, 1000);
        });
    </script>
</body>
</html>
