<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জনতার অনলাইন প্রেসক্লাব - ডেলিভারি তথ্য</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div id="main-card" class="bg-white max-w-lg w-full rounded-3xl shadow-xl p-8 text-center border border-slate-100">
        <!-- কাউন্টডাউন ও মেসেজ সেকশন -->
        <div id="display-area" class="space-y-6">
            <div class="animate-pulse">
                <div class="text-6xl mb-4">📦</div>
                <h2 id="msg-title" class="text-2xl font-bold text-slate-800">অপেক্ষা করুন...</h2>
            </div>
            
            <div class="w-16 h-16 mx-auto rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin"></div>
            <p id="counter" class="text-4xl font-bold text-blue-600">8</p>
            <p class="text-slate-500">সেকেন্ড পর আপনার ঠিকানা জমার ফর্মটি তৈরি হবে</p>
        </div>

        <!-- ফর্ম ওপেন হওয়ার বাটন (এটিই সবচেয়ে কার্যকর পদ্ধতি) -->
        <div id="action-area" class="hidden animate-in fade-in zoom-in duration-500 space-y-6">
            <div class="bg-green-50 p-6 rounded-2xl border border-green-200">
                <h3 class="text-2xl font-bold text-green-700 leading-relaxed">
                    আপনার আইডি কার্ড, টি-শার্ট সবকিছু পাঠানো হবে। অনুগ্রহ করে আপনার কুরিয়ারের ঠিকানা জমা দিন।
                </h3>
            </div>
            
            <a href="https://forms.gle/aWYBxaV35vyamfVz7" target="_blank" onclick="window.location.reload();"
               class="block w-full py-4 bg-blue-600 text-white font-bold text-lg rounded-xl hover:bg-blue-700 transition-all transform hover:scale-105 shadow-lg">
               কুরিয়ারের ঠিকানা জমা দিন
            </a>
        </div>
    </div>

    <script>
        let timeLeft = 8;
        const counterText = document.getElementById('counter');
        const displayArea = document.getElementById('display-area');
        const actionArea = document.getElementById('action-area');
        const formUrl = "https://forms.gle/aWYBxaV35vyamfVz7";

        const timer = setInterval(() => {
            timeLeft--;
            counterText.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                displayArea.classList.add('hidden');
                actionArea.classList.remove('hidden');
                
                // বাটন ক্লিক করার ঝামেলা এড়াতে অটো ওপেন করার চেষ্টা (ব্রাউজার ব্লক করলে ইউজার ক্লিক করবে)
                window.open(formUrl, '_blank');
            }
        }, 1000);
    </script>
</body>
</html>
